<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1c1d22; --muted:#6b6a66; --line:#e2ddd2;
  --accent:#bf3a24; --accent-ink:#fff; --good:#267a4d; --good-ink:#fff; --gold:#c9961a; --gold-ink:#1c1d22;
  --field-line:#8f8a80;
  --p1:#d6452f; --p2:#2f6fd6; --p3:#2f8f5b; --p4:#c9961a; --p5:#8a4fd6; --p6:#d62f8a;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14161c; --card:#1e2129; --ink:#f1efe9; --muted:#9a9890; --line:#2e323c;
    --accent:#ff6a4d; --accent-ink:#1c1d22; --good:#4cc283; --good-ink:#1c1d22; --gold:#e8b53a;
    --field-line:#6f7684; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* stop iPhone from enlarging text on its own (it does more when turned sideways) */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* pinch zoom works (for anyone who needs bigger text); double-tap zoom stays off so quick taps don't zoom;
   no rubber-band stretching past the edges */
html,body{touch-action:manipulation;overscroll-behavior:none}
button,label,input,textarea{touch-action:manipulation}
/* buttons, labels and fields use the same font as everything else */
button,input,textarea,select,label{font-family:inherit;line-height:inherit}
/* side gutter: 16px, more beside the notch, and centred on wide screens */
:root{--gl:max(16px, env(safe-area-inset-left), calc((100% - 760px) / 2));--gr:max(16px, env(safe-area-inset-right), calc((100% - 760px) / 2))}
/* extra room under the clock: on iPhone and iPad, the app opened from the home screen blurs a band
   below the status bar that reaches past the safe area, so the title starts below that band */
:root{--edge:0px}
@media (display-mode:standalone){@supports (-webkit-touch-callout:none){:root{--edge:24px}}}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:1rem/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + max(90px, 3.6rem))}
/* Solid strips under the clock and behind the Score round button, so the list slides away
   underneath them instead of showing through. The bottom one fades in over its top edge. */
body::before,body::after{content:"";position:fixed;left:0;right:0;z-index:4}
/* the strips take taps themselves, so nothing hidden behind them can be pressed by accident */
body::before{top:0;height:calc(env(safe-area-inset-top) + var(--edge));background:var(--bg)}
body::after{bottom:0;height:calc(env(safe-area-inset-bottom) + max(92px, 3.7rem));
  background:linear-gradient(to bottom, rgba(0,0,0,0), var(--bg) 20px)}
/* while another page is open, the main screen is held still (see syncScrollLock) */
body.locked{position:fixed;left:0;right:0;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:calc(14px + var(--edge)) var(--gr) 6px var(--gl)}
/* shrinks a little on narrow phones so "Phase 10 Scorekeeper" stays on one line beside Menu */
/* the title and the line under it sit together; the line is not part of the heading (screen readers read the title alone) */
header .htitle{flex:1;min-width:0}
header h1{font-size:clamp(1.125rem, 5.2vw, 1.75rem);margin:0;min-width:0;letter-spacing:-.5px;line-height:1.15}
header .htitle small{display:block;font-size:0.875rem;color:var(--muted);font-weight:500;letter-spacing:0;line-height:1.15}
.iconbtn{border:0;background:var(--card);color:var(--ink);border-radius:12px;min-height:44px;min-width:44px;
  padding:0 12px;font-size:0.9375rem;font-weight:600;box-shadow:0 0 0 1px var(--line) inset}
main,#upd{padding:0 var(--gr) 0 var(--gl)}
.card{background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--line) inset;padding:14px;margin:10px 0}
.player{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.rank{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:0.875rem;
  background:var(--line);color:var(--ink)}
.rank.first{background:var(--gold);color:var(--gold-ink)}
.pname{font-weight:700;font-size:1.125rem;display:flex;align-items:center;gap:4px 6px;flex-wrap:wrap;min-width:0;overflow-wrap:anywhere}
/* long names wrap instead of pushing points and buttons off the screen */
.player>div{min-width:0}
.dtag{flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pdesc{color:var(--muted);font-size:0.875rem}
.phasebadge{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.right{text-align:right}
.big{font-size:1.625rem;font-weight:800;line-height:1}
.pts{font-size:0.75rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden;grid-column:1/-1}
.bar>i{display:block;height:100%;border-radius:3px}
.cta{position:fixed;left:var(--gl);right:var(--gr);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:5;
  border:0;border-radius:16px;min-height:58px;font-size:1.125rem;font-weight:700;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 8px 24px rgba(0,0,0,.25)}
h2{font-size:0.9375rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 2px 6px}
table{width:100%;border-collapse:collapse;font-size:0.9375rem}
/* with many players the rounds table scrolls sideways inside its card, not the whole page */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tablewrap th{white-space:nowrap}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
th,td.tot{font-size:0.8125rem;color:var(--muted);font-weight:600}
td.r{color:var(--muted);width:34px}
tr.tap{cursor:pointer}
.made{color:var(--good);font-weight:700;font-size:0.75rem;display:block}
.miss{color:var(--muted);font-size:0.75rem;display:block}
.empty{color:var(--muted);text-align:center;padding:20px}
.banner{background:var(--gold);color:var(--gold-ink);border-radius:16px;padding:16px;margin:10px 0;text-align:center}
.banner b{font-size:1.375rem;display:block}

/* sheets */
.sheet{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:var(--bg)}
.sheet.open{display:flex}
.sheet .top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px + var(--edge)) var(--gr) 10px var(--gl);
  border-bottom:1px solid var(--line);background:var(--card)}
.sheet .top h3{flex:1;margin:0;font-size:1.125rem;text-align:center;min-width:0;overflow-wrap:anywhere}
.sheet .body{flex:1;overflow:auto;overscroll-behavior:contain;padding:8px var(--gr) calc(env(safe-area-inset-bottom) + 24px) var(--gl)}
/* a light 10px feather at the bottom edge of each page instead of a hard cut;
   taps pass through, and the last item scrolls clear of it */
.sheet::after{content:"";position:absolute;left:0;right:0;bottom:0;z-index:1;pointer-events:none;
  height:10px;background:linear-gradient(to bottom, rgba(0,0,0,0), var(--bg))}
.link{border:0;background:none;color:var(--accent);font-size:1.0625rem;font-weight:600;padding:8px 4px;min-width:64px;min-height:44px}
.link.l{text-align:left}.link.r{text-align:right}
.entry .row1{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.entry .row1 .pname{flex:1;flex-wrap:wrap}
.entry .row1 .toggle{flex:none}
.toggle{border:0;border-radius:12px;min-height:44px;padding:0 14px;font-size:0.9375rem;font-weight:700;
  background:var(--line);color:var(--ink)}
.toggle.on{background:var(--good);color:var(--good-ink)}
.ptsrow{display:flex;gap:8px;align-items:center}
.ptsrow input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--field-line);background:var(--bg);
  color:var(--ink);font-size:1.375rem;font-weight:700;padding:0 12px;text-align:right}
.chip{border:0;border-radius:12px;min-height:48px;padding:0 12px;font-size:0.875rem;font-weight:700;background:var(--line);color:var(--ink)}
.chip.out.on{background:var(--accent);color:var(--accent-ink)}
.hint{color:var(--muted);font-size:0.8125rem;margin:4px 2px 0}
.warn{color:var(--accent);font-size:0.875rem;font-weight:600;margin:8px 2px 0}
.warn:empty{display:none}
.card.entry.bad{box-shadow:0 0 0 2px var(--accent) inset}
.cardcount{text-align:center;font-size:1rem;margin:-6px 0 12px;color:var(--muted)}
.cardcount b{color:var(--ink)}
.counter{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;margin:8px 0}
.counter .lbl b{display:block}
.counter .lbl span{color:var(--muted);font-size:0.8125rem}
.counter button{width:48px;height:48px;border-radius:12px;border:0;background:var(--line);color:var(--ink);font-size:1.5rem;font-weight:700}
.counter .n{min-width:28px;text-align:center;font-size:1.25rem;font-weight:700}
.total{font-size:2.5rem;font-weight:800;text-align:center;margin:14px 0}
.wide{display:block;width:100%;border:0;border-radius:14px;min-height:52px;font-size:1.0625rem;font-weight:700;margin:10px 0;
  background:var(--line);color:var(--ink)}
.wide.primary{background:var(--accent);color:var(--accent-ink)}
.wide.danger{background:none;color:var(--accent);box-shadow:0 0 0 1px var(--line) inset}
.namerow{display:flex;gap:8px;margin:8px 0}
.namerow input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--field-line);background:var(--card);
  color:var(--ink);font-size:max(16px, 1.125rem);padding:0 12px}
.namerow button{width:48px;border:0;border-radius:12px;background:var(--line);color:var(--ink);font-size:1.25rem}
.namerow button:disabled{opacity:.35}
ol.phases{padding-left:28px;margin:8px 0}
ol.phases li{padding:8px 0;border-bottom:1px solid var(--line)}
.menuitem{display:block;width:100%;text-align:left;font-weight:400;line-height:1.35;border:0;background:var(--card);color:var(--ink);font-size:1.0625rem;
  padding:16px;border-radius:14px;margin:8px 0;box-shadow:0 0 0 1px var(--line) inset}
.menuitem span{display:block;color:var(--muted);font-size:0.8125rem;margin-top:2px}
.dealer{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.dealer>div{min-width:0;overflow-wrap:anywhere}
.dicon{font-size:1.75rem;width:1.875rem;text-align:center}
.dtag{font-size:0.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:var(--ink);color:var(--bg);
  border-radius:6px;padding:2px 6px;margin-left:4px}
.dealt{display:block;font-size:0.6875rem;color:var(--muted);font-style:italic}
.sechead{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.sechead h2{margin:0 2px}
.chip.small{min-height:44px;font-size:0.875rem}
.editwarn{background:#f3c64a;color:#2a2100;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:0.9375rem}
.editwarn b{display:block;margin-bottom:2px}
#sheetRound.editing .top{background:#f3c64a}
#sheetRound.editing .top h3{color:#2a2100}
#sheetRound.editing .top .link{color:#2a2100}
.updbar{display:flex;gap:10px;align-items:center;background:var(--good);color:var(--good-ink);border-radius:14px;padding:10px 12px;margin:10px 0}
.updbar span{flex:1;font-size:0.9375rem}
.updbar button{border:0;border-radius:10px;min-height:44px;padding:0 14px;font-weight:700;font-size:0.9375rem;background:#fff;color:#1c1d22}
.welcome{text-align:center;padding:22px 18px}
.welcome p{margin:10px 0;text-align:left}
.wicon{width:88px;height:88px;border-radius:20px;display:block;margin:0 auto}
.wtitle{font-size:1.625rem;text-transform:none;letter-spacing:0;color:var(--ink);margin:6px 0 4px}
.dealpick{display:flex;flex-wrap:wrap;gap:8px}
.dealpick .toggle{max-width:100%;overflow-wrap:anywhere;height:auto;min-height:44px}
/* wider screens and sideways phones: player cards side by side */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));column-gap:10px}
/* sideways phone (short screen): slimmer header and bottom button */
@media (max-height:500px){
  :root{--edge:0px}
  header{padding-top:8px}
  header h1{font-size:1.375rem}
  .cta{min-height:46px;font-size:1rem;bottom:calc(env(safe-area-inset-bottom) + 8px)}
  body{padding-bottom:calc(env(safe-area-inset-bottom) + 66px)}
  body::after{height:calc(env(safe-area-inset-bottom) + 68px)}
}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.menuitem{cursor:pointer}
/* a clear ring around whatever has keyboard focus; the hidden file picker shows it on its label */
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#sheetRound.editing .top :focus-visible{outline-color:#2a2100}
.updbar :focus-visible{outline-color:var(--good-ink)}
label.menuitem:has(+ #fileIn:focus-visible){outline:3px solid var(--ink);outline-offset:2px}
/* a page's title takes focus when the page opens (so screen readers start there); it is not a control, so no ring */
.sheet .top h3:focus{outline:none}
a.menuitem{text-decoration:none;box-sizing:border-box}
.about-head{padding:8px 2px 4px}
.about-head img{width:64px;height:64px;border-radius:14px;display:block;margin-bottom:12px}
.about-head b{display:block;font-size:1.25rem;line-height:1.25}
.about-head p{margin:6px 0 0;color:var(--muted);font-size:0.9375rem;line-height:1.45}
.credit{margin-top:14px;font-size:0.8125rem;color:var(--muted)}
.credit a,.banner a,.smallprint a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.banner .support{display:block;margin-top:8px;font-size:0.875rem;opacity:.95}
.smallprint{margin:18px 2px 0;color:var(--muted);font-size:0.8125rem;line-height:1.45}
.smallprint ul{margin:4px 0 0;padding-left:18px}
.smallprint li{margin-top:6px}
.pastebox{width:100%;min-height:220px;border-radius:12px;border:1px solid var(--field-line);background:var(--card);color:var(--ink);
  font:max(16px, 1rem)/1.4 ui-monospace,Menlo,monospace;padding:10px}
.past{padding:12px 14px}
.past b{display:block}
.past span{color:var(--muted);font-size:0.875rem}
</style>
</head>
<body>
<header>
  <div class="htitle"><h1>Phase 10 Scorekeeper</h1><small id="sub"></small></div>
  <button class="iconbtn" id="btnMenu" aria-label="Menu">Menu</button>
</header>
<div id="upd" role="status"></div>
<main id="main"></main>
<button class="cta" id="btnRound">Score round</button>

<!-- Round entry -->
<!-- Each page is a dialog: while it is open, the screen behind it cannot be reached (see open and close). -->
<section class="sheet" id="sheetRound" role="dialog" aria-modal="true" aria-labelledby="roundTitle">
  <div class="top"><button class="link l" data-close>Cancel</button><h3 id="roundTitle" tabindex="-1">Round</h3><button class="link r" id="btnSaveRound">Save</button></div>
  <div class="body" id="roundBody"></div>
  <p class="vh" id="roundSaid" role="status"></p>
</section>

<!-- Card counter -->
<section class="sheet" id="sheetCount" role="dialog" aria-modal="true" aria-labelledby="countTitle">
  <div class="top"><button class="link l" id="btnCountCancel">Cancel</button><h3 id="countTitle" tabindex="-1">Count cards</h3><button class="link r" id="btnCountUse">Use</button></div>
  <div class="body" id="countBody"></div>
</section>

<!-- Menu -->
<section class="sheet" id="sheetMenu" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
  <div class="top"><span style="min-width:64px"></span><h3 id="menuTitle" tabindex="-1">Menu</h3><button class="link r" data-close>Done</button></div>
  <div class="body" id="menuBody"></div>
</section>

<!-- Generic page (players, phases, past games) -->
<section class="sheet" id="sheetPage" role="dialog" aria-modal="true" aria-labelledby="pageTitle">
  <div class="top"><button class="link l" id="pageBack">Back</button><h3 id="pageTitle" tabindex="-1"></h3><button class="link r" id="pageAction"></button></div>
  <div class="body" id="pageBody"></div>
</section>

<script>
const PHASES = [
  "2 sets of 3",
  "1 set of 3 + 1 run of 4",
  "1 set of 4 + 1 run of 4",
  "1 run of 7",
  "1 run of 8",
  "1 run of 9",
  "2 sets of 4",
  "7 cards of one color",
  "1 set of 5 + 1 set of 2",
  "1 set of 5 + 1 set of 3"
];
const CARDS = [
  {k:"low", label:"Cards 1 to 9", note:"5 points each", v:5},
  {k:"high", label:"Cards 10 to 12", note:"10 points each", v:10},
  {k:"skip", label:"Skip", note:"15 points each", v:15},
  {k:"wild", label:"Wild", note:"25 points each", v:25}
];
const COLORS = ["var(--p1)","var(--p2)","var(--p3)","var(--p4)","var(--p5)","var(--p6)"];
// Each player keeps their colour when seats are reordered. Games saved before v13 have no
// colours list, so seat 1 gets colour 1 and so on, exactly as before.
const colorOf = (g, i) => COLORS[((g.colors && g.colors[i] != null) ? g.colors[i] : i) % 6];
const KEY = "phase10.v1";          // where scores live; never changes between app versions
const APP_VERSION = 23;
const LINKS = {
  support: "https://nxlx.gumroad.com/l/phase-ten-scorekeeper",
  shop: "https://nxlx.gumroad.com",
  instagram: "https://instagram.com/nxlx.systems",
  code: "https://github.com/nxlx-systems/nxlx-phase-scorekeeper"
};            // bump with version.json on every update
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- storage ---------- */
function newGame(players){ return {id:Date.now(), started:new Date().toISOString(), players:[...players], rounds:[], ended:null}; }
function load(){
  // Existing scores on this device are always kept. A first visit starts empty (welcome screen).
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") return {current: s.current || null, past: s.past || []}; } catch(e){}
  return {current:null, past:[]};
}
let state = load();
// If the device refuses to save (storage full, or blocked in private browsing), say so once
// instead of failing silently, so nobody finds out after the game that nothing was kept.
let saveWarned = false;
// The app can be open in two places at once (two tabs, or the installed app and a tab). Each keeps
// its own copy on screen, so before this one saves, and whenever it comes back into view, it takes
// up any newer scores the other one saved instead of writing its older copy over them.
let lastSaved = null; try { lastSaved = localStorage.getItem(KEY); } catch(e){}              // what this window last read or wrote
function newerElsewhere(){ try { const now = localStorage.getItem(KEY); return now !== lastSaved ? now : null; } catch(e){ return null; } }
function takeNewer(fromSave){
  if (newerElsewhere() == null) return false;
  state = load(); lastSaved = localStorage.getItem(KEY);
  closeAll();
  render();
  alert(fromSave
    ? "The scores were changed in another window. This screen now shows those scores, and your last change here was not saved. Please make it again."
    : "The scores were changed in another window, so this screen now shows the latest scores.");
  return true;
}
window.addEventListener("storage", e => { if (e.key === KEY || e.key === null) takeNewer(false); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) takeNewer(false); });
function save(){
  if (takeNewer(true)) return true;                          // another window saved first: keep theirs
  try { const text = JSON.stringify(state); localStorage.setItem(KEY, text); lastSaved = text; saveWarned = false; return true; }
  catch(e){
    if (!saveWarned) {
      saveWarned = true;
      alert("This device would not save the scores. Its storage may be full, or private browsing may be on.\n\nThe game is still on screen. Use Menu, then Back up scores, to keep a copy.");
    }
    return false;
  }
}

/* ---------- game maths ---------- */
function stats(g){
  return g.players.map((name,i) => {
    let total=0, done=0;
    g.rounds.forEach(r => { total += Number(r.pts[i])||0; if (r.made[i]) done++; });
    return {i, name, total, done, phase: Math.min(done+1, 10), finished: done>=10};
  });
}
function ranked(g){
  return stats(g).sort((a,b) => b.done - a.done || a.total - b.total);
}
// Dealer moves one seat to the left (next player in the list) every round.
function nextDealer(g){
  const n = g.players.length;
  if (g.dealerSet != null) return g.dealerSet % n;
  const last = g.rounds[g.rounds.length-1];
  if (last && last.dealer != null) return (last.dealer + 1) % n;
  return ((g.firstDealer || 0) + g.rounds.length) % n;
}
function dealerOf(g, ri){
  const r = g.rounds[ri];
  if (r && r.dealer != null) return r.dealer;
  return ((g.firstDealer || 0) + ri) % g.players.length;
}
function winner(g){
  const s = stats(g).filter(p => p.finished);
  if (!s.length) return null;
  s.sort((a,b) => a.total - b.total);
  return s[0];
}

/* ---------- round entry ---------- */
let draft = null; // {index, pts:[], made:[], out:[]}
// Everyone holds 10 cards after each turn, and nobody can lay cards down before making their phase.
// So a player who missed their phase ends the round with exactly 10 cards: 50 to 250 points.
const HAND = 10, MIN_MISSED = HAND * 5, MAX_HAND = HAND * 25;
function handProblem(i){
  const raw = draft.pts[i], n = parseInt(raw, 10) || 0;
  if (!draft.made[i]) {
    if (raw === "") return `Missed their phase, so they still hold 10 cards. Enter their points (at least ${MIN_MISSED}).`;
    if (n < MIN_MISSED) return `Missed their phase, so they still hold 10 cards: at least ${MIN_MISSED} points. ${n} is too low for 10 cards.`;
  }
  // A blank would be saved as 0, which reads as "went out". Make it a choice, not an accident.
  if (raw === "") return `No points entered. Enter the cards left in their hand, or tap Went out if they have none.`;
  if (n > MAX_HAND) return `${n} is more than 10 cards can add up to (${MAX_HAND} at most).`;
  if (n % 5) return `Points come in 5s (cards are worth 5, 10, 15 or 25).`;
  return null;
}
function showProblem(i){
  const msg = handProblem(i);
  // The warning is the points field's description (aria-describedby), so a screen reader reads it
  // with the field. It is not announced on every keystroke; Save says what is wrong if it stops.
  const el = document.getElementById(`warn-${i}`); if (el) el.innerHTML = msg ? `<span aria-hidden="true">⚠</span> ${esc(msg)}` : "";
  const card = document.querySelector(`[data-entry="${i}"]`); if (card) card.classList.toggle("bad", !!msg);
}
function openRound(index){
  const g = state.current;
  const existing = index!=null ? g.rounds[index] : null;
  draft = {
    index: index==null ? null : index,
    pts: g.players.map((_,i) => existing ? String(existing.pts[i] ?? "") : ""),
    made: g.players.map((_,i) => existing ? !!existing.made[i] : false)
  };
  const dl = index==null ? nextDealer(g) : dealerOf(g, index);
  const num = (index==null ? g.rounds.length : index)+1;
  $("#roundTitle").textContent = index==null ? `Round ${num} · ${g.players[dl]} deals` : `Editing round ${num}`;
  $("#btnSaveRound").textContent = index==null ? "Save" : "Save changes";
  $("#sheetRound").classList.toggle("editing", index!=null);
  $("#roundSaid").textContent = "";
  drawRound();
  open("#sheetRound");
}
function drawRound(){
  const g = state.current, st = stats(g);
  const f = noteFocus($("#roundBody"));
  let h = "";
  if (draft.index!=null) h += `<div class="editwarn"><b>You are changing round ${draft.index+1}, which was already played.</b>
      ${esc(g.players[dealerOf(g, draft.index)])} dealt it. Tap Cancel to leave it as it was.</div>`;
  g.players.forEach((name,i) => {
    // phase they were attempting in this round
    let done = 0; const upto = draft.index==null ? g.rounds.length : draft.index;
    for (let r=0;r<upto;r++) if (g.rounds[r].made[i]) done++;
    const ph = Math.min(done+1,10);
    const isOut = draft.pts[i]==="0";
    h += `<div class="card entry" data-entry="${i}">
      <div class="row1">
        <div class="pname"><span class="dot" style="background:${colorOf(g, i)}"></span>${esc(name)}
          <span class="pdesc" style="font-weight:400">· Phase ${ph}</span></div>
        <button class="toggle ${draft.made[i]?"on":""}" data-made="${i}" aria-pressed="${draft.made[i]?"true":"false"}">${draft.made[i]?`<span aria-hidden="true">✓ </span>Made phase`:"Made phase?"}</button>
      </div>
      <div class="ptsrow">
        <button class="chip out ${isOut?"on":""}" data-out="${i}">Went out</button>
        <input inputmode="numeric" pattern="[0-9]*" placeholder="Points" value="${esc(draft.pts[i])}" data-pts="${i}" aria-label="Points for ${esc(name)}" aria-describedby="warn-${i}">
        <button class="chip" data-count="${i}" aria-label="Count ${esc(name)}'s cards">Count</button>
      </div>
      <p class="hint">${esc(PHASES[ph-1])}</p>
      <p class="warn" id="warn-${i}"></p>
    </div>`;
  });
  h += `<p class="hint">Points are the cards left in your hand. “Count” adds them up for you. Anyone who missed their phase still holds 10 cards.</p>`;
  if (draft.index!=null) h += `<button class="wide danger" id="btnDelRound">Delete this round</button>`;
  $("#roundBody").innerHTML = h;
  document.querySelectorAll("[data-made]").forEach(b => b.onclick = () => { const i=+b.dataset.made; draft.made[i]=!draft.made[i]; drawRound(); });
  document.querySelectorAll("[data-out]").forEach(b => b.onclick = () => { const i=+b.dataset.out; draft.pts[i]="0"; draft.made[i]=true; drawRound(); });
  document.querySelectorAll("[data-pts]").forEach(inp => inp.oninput = () => { draft.pts[+inp.dataset.pts] = inp.value.replace(/[^0-9]/g,""); showProblem(+inp.dataset.pts); });
  g.players.forEach((_,i) => showProblem(i));
  document.querySelectorAll("[data-count]").forEach(b => b.onclick = () => openCount(+b.dataset.count));
  const del = $("#btnDelRound");
  if (del) del.onclick = () => {
    if (!confirm(`Delete round ${draft.index+1}? This cannot be undone.`)) return;
    state.current.rounds.splice(draft.index,1); save(); close("#sheetRound"); render();
  };
  restoreFocus($("#roundBody"), f);
}
$("#btnSaveRound").onclick = () => {
  document.activeElement && document.activeElement.blur();
  const issues = state.current.players.map((name,i) => { const m = handProblem(i); return m ? `• ${name}: ${m}` : null; }).filter(Boolean);
  if (issues.length && !confirm(`Please check before saving:\n\n${issues.join("\n")}\n\nSave anyway?`)) {
    // Say once, for screen readers, why nothing was saved (the warnings themselves stay quiet while typing).
    const said = $("#roundSaid"); said.textContent = "";
    setTimeout(() => { said.textContent = `Not saved yet. Please check: ${issues.map(s => s.slice(2)).join(" ")}`; }, 100);
    return;
  }
  const r = {pts: draft.pts.map(v => parseInt(v,10)||0), made: [...draft.made]};
  const g = state.current;
  if (draft.index==null){ r.dealer = nextDealer(g); g.rounds.push(r); g.dealerSet = null; }
  else { r.dealer = dealerOf(g, draft.index); g.rounds[draft.index] = r; }
  save(); close("#sheetRound"); render();
};

/* ---------- card counter ---------- */
let countFor = null, counts = {};
function openCount(i){
  countFor = i; counts = {low:0,high:0,skip:0,wild:0};
  $("#countTitle").textContent = state.current.players[i];
  drawCount(); open("#sheetCount");
}
function countTotal(){ return CARDS.reduce((s,c) => s + counts[c.k]*c.v, 0); }
function countCards(){ return CARDS.reduce((s,c) => s + counts[c.k], 0); }
function countProblem(){
  const n = countCards();
  if (!draft.made[countFor] && n !== HAND) return `They missed their phase, so they should have 10 cards. You've counted ${n}.`;
  if (n > HAND) return `That's ${n} cards. Nobody ends a round with more than 10.`;
  return null;
}
// The rows are built once and stay, so a pressed + or − keeps focus. Only the numbers change.
// The total, the card count and the warning sit in one status area, so a screen reader reads
// the new total after each press.
function drawCount(){
  const box = $("#countBody");
  if (!$("#countStatus")) {
    box.innerHTML = `<div id="countStatus" role="status"></div>` + CARDS.map(c =>
      `<div class="card counter"><div class="lbl"><b>${c.label}</b><span>${c.note}</span></div>
      <button data-dec="${c.k}" aria-label="One less, ${c.label}">−</button><div class="n" data-n="${c.k}"></div><button data-inc="${c.k}" aria-label="One more, ${c.label}">+</button></div>`).join("");
    box.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { counts[b.dataset.inc]++; drawCount(); });
    box.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => { counts[b.dataset.dec]=Math.max(0,counts[b.dataset.dec]-1); drawCount(); });
  }
  const n = countCards(), pr = countProblem();
  $("#countStatus").innerHTML = `<div class="total">${countTotal()}<div class="pts">points in hand</div></div>
    <div class="cardcount"><b>${n}</b> card${n===1?"":"s"}${draft.made[countFor] ? "" : " of 10"}</div>
    <p class="warn" style="text-align:center">${pr ? `<span aria-hidden="true">⚠</span> ${esc(pr)}` : ""}</p>`;
  CARDS.forEach(c => { box.querySelector(`[data-n="${c.k}"]`).textContent = counts[c.k]; });
}
$("#btnCountCancel").onclick = () => close("#sheetCount");
$("#btnCountUse").onclick = () => { const pr = countProblem(); if (pr && !confirm(`${pr}\n\nUse ${countTotal()} points anyway?`)) return; draft.pts[countFor] = String(countTotal()); close("#sheetCount"); drawRound(); };

// Game setup: who's playing and who deals first. Nothing changes until "Start".
function openSetup(names, dealer){
  let list = names.length >= 2 ? [...names] : [...names, ...Array(2 - names.length).fill("")];
  let first = Math.min(dealer || 0, list.length - 1);
  const tick = `<span aria-hidden="true">✓ </span>`;
  const draw = () => {
    const f = noteFocus($("#pageBody"));
    const shown = list.map((n,i) => n.trim() || `Player ${i+1}`);
    let h = `<p class="hint">Who's playing? Enter names in seating order, going left around the table. The deal passes in this order.</p>`;
    h += list.map((n,i)=>`<div class="namerow"><input value="${esc(n)}" data-sname="${i}" placeholder="Player ${i+1}" aria-label="Player ${i+1} name" autocapitalize="words">${
      list.length>2?`<button data-srm="${i}" aria-label="Remove ${esc(shown[i])}">✕</button>`:""}</div>`).join("");
    if (list.length < 6) h += `<button class="wide" id="sAdd">Add player</button>`;
    h += `<h2>Who deals first?</h2><div class="dealpick">${shown.map((n,i)=>
      `<button class="toggle ${i===first?"on":""}" data-sdeal="${i}" aria-pressed="${i===first?"true":"false"}">${i===first?tick:""}${esc(n)}</button>`).join("")}</div>
      <p class="hint" id="sFirst">${esc(shown[(first+1)%shown.length])} plays first.</p>
      <button class="wide primary" id="sStart">Start game</button>`;
    $("#pageBody").innerHTML = h;
    document.querySelectorAll("[data-sname]").forEach(inp => {
      inp.oninput = () => {
        const i = +inp.dataset.sname; list[i] = inp.value;
        const nm = j => list[j].trim() || `Player ${j+1}`;
        document.querySelector(`[data-sdeal="${i}"]`).innerHTML = (i === first ? tick : "") + esc(nm(i));
        const rm = document.querySelector(`[data-srm="${i}"]`); if (rm) rm.setAttribute("aria-label", `Remove ${nm(i)}`);
        $("#sFirst").textContent = `${nm((first+1)%list.length)} plays first.`;
      };
    });
    document.querySelectorAll("[data-srm]").forEach(b => b.onclick = () => {
      const rm = +b.dataset.srm; list.splice(rm,1);
      if (rm < first) first--; else if (rm === first || first >= list.length) first = 0;
      draw(); });
    document.querySelectorAll("[data-sdeal]").forEach(b => b.onclick = () => { first = +b.dataset.sdeal; draw(); });
    const add = $("#sAdd"); if (add) add.onclick = () => { list.push(""); draw(); const ins = document.querySelectorAll("[data-sname]"); ins[ins.length-1].focus(); };
    $("#sStart").onclick = start;
    restoreFocus($("#pageBody"), f);
  };
  const start = () => {
    const g = state.current;
    if (g && g.rounds.length && !confirm("Start a new game? The current game moves to Past games.")) return;
    if (g && g.rounds.length){ g.ended = new Date().toISOString(); state.past.unshift(g); }
    const ng = newGame(list.map((n,i)=>n.trim() || `Player ${i+1}`));
    ng.firstDealer = first;
    state.current = ng;
    save(); close("#sheetPage"); close("#sheetMenu"); render();
  };
  showPage("New game", "", "Start", () => start());
  draw();
}
function showPage(title, html, action, onAction){
  $("#pageTitle").textContent = title;
  $("#pageBody").innerHTML = html;
  const a = $("#pageAction"); a.textContent = action || ""; a.onclick = onAction || null;
  a.style.visibility = action ? "" : "hidden";   // an empty button would still be reached by screen readers
  open("#sheetPage");
}
$("#pageBack").onclick = () => close("#sheetPage");

function showPlayers(){
  const g = state.current, locked = g.rounds.length>0;
  // One entry per seat, in seating order. "from" is the player's old seat (-1 for someone new),
  // so their scores, dealing history and colour can follow them when seats are moved.
  let seats = g.players.map((name,i) => ({name, from:i, color: (g.colors && g.colors[i] != null) ? g.colors[i] : i}));
  const freeColor = () => [0,1,2,3,4,5].find(c => !seats.some(s => s.color === c)) ?? 0;
  // The move buttons follow the player: after ↑, focus stays on that player's ↑ in their new seat.
  const move = (i, by) => { const j = i + by; if (j < 0 || j >= seats.length) return; [seats[i], seats[j]] = [seats[j], seats[i]]; draw(j); };
  // Each row's buttons say whose they are: the name, or the seat number while the name is empty.
  const who = i => seats[i].name.trim() || `player ${i+1}`;
  const label = i => ({up: `Move ${who(i)} up`, down: `Move ${who(i)} down`, rm: `Remove ${who(i)}`});
  const draw = (to) => {
    const f = noteFocus($("#pageBody"));
    if (f && to != null && (f.attr === "up" || f.attr === "down")) f.val = String(to);
    let h = `<p class="hint">Seating order, going left around the table. The deal passes in this order.</p>`;
    h += seats.map((s,i)=>`<div class="namerow"><input value="${esc(s.name)}" data-name="${i}" placeholder="Name" aria-label="Player ${i+1} name">
      <button data-up="${i}" aria-label="${esc(label(i).up)}" ${i===0?"disabled":""}>↑</button>
      <button data-down="${i}" aria-label="${esc(label(i).down)}" ${i===seats.length-1?"disabled":""}>↓</button>${
      locked || seats.length<=2 ? "" : `<button data-rm="${i}" aria-label="${esc(label(i).rm)}">✕</button>`}</div>`).join("");
    h += locked
      ? `<p class="hint">Use ↑ and ↓ if people are sitting in a different order. Scores move with each player, and the same person still deals next. To add or remove players, start a new game first.</p>`
      : (seats.length < 6 ? `<button class="wide" id="addP">Add player</button>` : "");
    $("#pageBody").innerHTML = h;
    document.querySelectorAll("[data-name]").forEach(inp => inp.oninput = () => {
      const i = +inp.dataset.name; seats[i].name = inp.value;
      Object.entries(label(i)).forEach(([k, text]) => { const b = document.querySelector(`[data-${k}="${i}"]`); if (b) b.setAttribute("aria-label", text); });
    });
    document.querySelectorAll("[data-up]").forEach(b => b.onclick = () => move(+b.dataset.up, -1));
    document.querySelectorAll("[data-down]").forEach(b => b.onclick = () => move(+b.dataset.down, 1));
    document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { if (seats.length>2){ seats.splice(+b.dataset.rm,1); draw(); } });
    const add = $("#addP"); if (add) add.onclick = () => { if (seats.length<6){ seats.push({name:"", from:-1, color:freeColor()}); draw(); } };
    restoreFocus($("#pageBody"), f);
  };
  showPage("Players", "", "Save", () => {
    const order = seats.map(s => s.from);              // order[newSeat] = oldSeat
    const newSeat = old => order.indexOf(old);          // -1 if that player was removed
    const moved = order.some((o,i) => o !== i) || order.length !== g.players.length;
    const nd = nextDealer(g);                            // who deals next, before anything moves
    if (locked && moved) {
      g.rounds.forEach((r, ri) => {
        // Pin who dealt each round first: rounds saved by early versions have no dealer and
        // would otherwise be worked out from the new seating, naming the wrong person.
        r.dealer = newSeat(dealerOf(g, ri));
        r.pts = order.map(o => r.pts[o]);
        r.made = order.map(o => r.made[o]);
      });
      g.firstDealer = Math.max(0, newSeat(g.firstDealer || 0));
      g.dealerSet = newSeat(nd);                         // keep the same person on the next deal
    } else if (!locked) {
      // No rounds yet: whoever was going to deal still deals first (if they are still playing).
      g.firstDealer = Math.max(0, newSeat(nd));
      g.dealerSet = null;
      g.rounds = [];
    }
    g.players = seats.map((s,i) => s.name.trim() || `Player ${i+1}`);
    g.colors = seats.map(s => s.color);
    save(); close("#sheetPage"); render();
  });
  draw();
}
function showPast(){
  if (!state.past.length) return showPage("Past games", `<div class="card empty">No finished games yet.</div>`);
  const h = state.past.map((g,gi) => {
    const w = winner(g) || ranked(g)[0];
    const d = new Date(g.started).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
    return `<button class="menuitem past" data-past="${gi}"><b>${d} · ${esc(w.name)} ${winner(g)?"won":"led"}</b>
      <span>${ranked(g).map(p=>`${esc(p.name)} P${p.finished?"10 ✓":p.phase} ${p.total}`).join(" · ")} · ${g.rounds.length} rounds</span></button>`;
  }).join("");
  showPage("Past games", h);
  document.querySelectorAll("[data-past]").forEach(b => b.onclick = () => {
    const g = state.past[+b.dataset.past];
    let t = `<div class="card tablewrap" style="padding:6px 10px"><table>${tableHead(g)}`;
    g.rounds.forEach((r,ri)=>{ t += `<tr><td class="r">${ri+1}</td>${g.players.map((_,i)=>`<td>${Number(r.pts[i])||0}${r.made[i]?`<span class="made"><span aria-hidden="true">✓</span><span class="vh">made phase</span></span>`:""}</td>`).join("")}</tr>`; });
    t += `<tr><th scope="row"><span aria-hidden="true">Σ</span><span class="vh">Total</span></th>${stats(g).map(p=>`<td class="tot">${p.total}</td>`).join("")}</tr></table></div>
      <button class="wide danger" id="delPast">Delete this game</button>`;
    showPage("Game", t);
    $("#delPast").onclick = () => { if (confirm("Delete this past game? This cannot be undone.")){ state.past.splice(+b.dataset.past,1); save(); showPast(); } };
  });
}
async function exportData(){
  const text = JSON.stringify(state, null, 1);
  const name = `phase10-backup-${new Date().toISOString().slice(0,10)}.json`;
  const file = new File([text], name, {type:"application/json"});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file]}); return; }   // the file only: a title or text is saved as a second file on some phones
  } catch(e){ if (e.name==="AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; a.click();
}
function readFile(f){
  if (f.text) return f.text();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(f); });
}
function parseBackup(text){
  text = String(text || "").replace(/^﻿/, "").trim();
  // tolerate extra text around the backup (e.g. pasted from a message)
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a < 0 || b < a) throw new Error("no backup found");
  const s = JSON.parse(text.slice(a, b + 1));
  const g = s.current || (Array.isArray(s.players) && Array.isArray(s.rounds) ? s : null);
  if (!g || !Array.isArray(g.players) || !Array.isArray(g.rounds)) throw new Error("not a scorekeeper backup");
  return { current: g, past: Array.isArray(s.past) ? s.past : [] };
}
function restoreFromText(text){
  let s;
  try { s = parseBackup(text); }
  catch(e){ alert("That isn't a scorekeeper backup (" + e.message + ")."); return; }
  const n = s.current.rounds.length;
  if (!confirm(`Replace the scores on this device with the backup? (${s.current.players.join(", ")}, ${n} round${n===1?"":"s"}, ${s.past.length} past game${s.past.length===1?"":"s"})`)) return;
  state = s; save();
  closeAll();
  render();
}
function importData(ev){
  const input = ev.target, f = input.files && input.files[0];
  if (!f) return;
  readFile(f).then(restoreFromText).catch(e => alert("Could not read that file: " + (e && e.message || e)))
    .finally(() => { input.value = ""; });
}

/* ---------- sheets ---------- */
// Pages stack in page order: the card counter sits over a round, and a page (Players, Past games
// and so on) sits over the Menu. Only the top one can be reached by keyboard and screen readers:
// the main screen and any page underneath are made inert while it is open.
const MAIN_PARTS = ["header", "#upd", "#main", "#btnRound"];
const openers = new Map();        // page -> what had focus when it opened, to go back to on close
function topSheet(){ const o = document.querySelectorAll(".sheet.open"); return o.length ? o[o.length - 1] : null; }
function syncInert(){
  const top = topSheet();
  MAIN_PARTS.forEach(s => $(s).toggleAttribute("inert", !!top));
  document.querySelectorAll(".sheet").forEach(el => el.toggleAttribute("inert", el.classList.contains("open") && el !== top));
}
function open(sel){
  const el = $(sel);
  if (!el.classList.contains("open")) { openers.set(el, document.activeElement); el.classList.add("open"); }
  syncInert();
  const h = el.querySelector("h3"); if (h) h.focus();   // start reading at the page's title
}
function close(sel){
  const el = $(sel);
  if (!el.classList.contains("open")) return;
  el.classList.remove("open");
  const back = openers.get(el); openers.delete(el);
  syncInert();
  if (!back || back === document.body) return;          // e.g. a tap on iPhone, where buttons never take focus
  if (back.tagName === "INPUT" || back.tagName === "TEXTAREA") return;   // a tap left focus in a field: leave the keyboard down
  if (back.isConnected && !back.closest("[inert]")) back.focus();
  // The main screen is often redrawn just after a page closes (after Save, for example), which
  // replaces the button that opened it. Once that is done, find the new one by its id.
  if (back.id) setTimeout(() => {
    const again = document.getElementById(back.id);
    if ((!document.activeElement || document.activeElement === document.body) && again && !again.closest("[inert]")) again.focus();
  }, 0);
}
function closeAll(){ [...document.querySelectorAll(".sheet.open")].reverse().forEach(el => close("#" + el.id)); }
// Escape closes the top page the same way its Cancel, Back or Done button does.
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || e.isComposing) return;
  const top = topSheet(); if (!top) return;
  const btn = top.id === "sheetCount" ? $("#btnCountCancel") : top.id === "sheetPage" ? $("#pageBack") : top.querySelector("[data-close]");
  if (btn) { e.preventDefault(); btn.click(); }
});
// After a page's contents are redrawn (a button pressed, a row added), put focus back on the same
// control, so keyboard and screen reader users are not dropped at the top. Only when focus was in
// that part of the page before; a text field gets focus back only if it had it (with the caret
// where it was), so a tap never brings up the on-screen keyboard.
function noteFocus(box){
  const el = document.activeElement;
  if (!el || el === box || !box.contains(el)) return null;
  const attr = Object.keys(el.dataset || {})[0];
  if (attr) return {attr, val: el.dataset[attr], input: el.tagName === "INPUT", s: el.selectionStart, e: el.selectionEnd};
  return el.id ? {id: el.id} : null;
}
// When a finger or mouse taps a button, the text field being typed in keeps focus on iPhone and
// Mac; a redraw right after such a tap leaves the field unfocused, so the keyboard drops as before.
let lastTap = 0;
document.addEventListener("pointerdown", () => { lastTap = Date.now(); }, true);
function restoreFocus(box, f){
  if (!f) return;
  if (f.input && Date.now() - lastTap < 1000) return;
  const find = (a, v) => { const el = box.querySelector(`[data-${a}="${v}"]`); return el && !el.disabled ? el : null; };
  const pair = {up: "down", down: "up"};
  let el = f.id ? document.getElementById(f.id) : find(f.attr, f.val);
  // the same control is gone or turned off (a row removed, a player moved to the top): use the
  // nearest button instead, never a text field, or else the page's title
  if (!el && !f.id && !f.input) el = (pair[f.attr] && find(pair[f.attr], f.val)) || find(f.attr, +f.val - 1);
  if (!el || !box.contains(el)) el = box.closest(".sheet").querySelector("h3");
  el.focus();
  if (f.input && el.tagName === "INPUT" && f.s != null) { try { el.setSelectionRange(f.s, f.e); } catch(e){} }
}
// While any page (Menu, a round, Who deals? and so on) is open, hold the main screen still so it
// cannot scroll behind it, then put it back exactly where it was. Watching the pages themselves
// catches every way they open and close.
let lockY = 0;
function syncScrollLock(){
  const anyOpen = !!document.querySelector(".sheet.open"), locked = document.body.classList.contains("locked");
  if (anyOpen && !locked){ lockY = window.scrollY; document.body.style.top = `-${lockY}px`; document.body.classList.add("locked"); }
  else if (!anyOpen && locked){ document.body.classList.remove("locked"); document.body.style.top = ""; window.scrollTo(0, lockY); }
}
const sheetWatch = new MutationObserver(syncScrollLock);
document.querySelectorAll(".sheet").forEach(el => sheetWatch.observe(el, {attributes:true, attributeFilter:["class"]}));
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => close("#" + b.closest(".sheet").id));
$("#btnMenu").onclick = () => { drawMenu(); open("#sheetMenu"); };
$("#btnRound").onclick = () => { if (!state.current || winner(state.current)) startNew(); else openRound(null); };

/* ---------- updates ---------- */
// Returns "offline", "current", or the newer version info.
async function checkForUpdate(){
  try {
    const res = await fetch("version.json?t=" + Date.now(), {cache: "no-store"});
    if (!res.ok) return "offline";
    const v = await res.json();
    return (Number(v.version) > APP_VERSION) ? v : "current";
  } catch(e){ return "offline"; }
}
function showUpdateBar(v){
  $("#upd").innerHTML = `<div class="updbar"><span><b>Update available</b><br>${esc(v.notes || "A newer version is ready.")}</span>
    <button id="btnUpd">Update now</button></div>`;
  $("#btnUpd").onclick = () => applyUpdate(v);
}
async function applyUpdate(v){
  if (!confirm(`Update to version ${v.version}? Your scores stay exactly as they are.`)) return;
  // Save the scores first. Updating reloads the page from what is saved, so if this device is
  // not saving, stop here: reloading would lose every round that is only on screen.
  saveWarned = true;                                   // show the message below, not the general one
  if (!save()) {
    alert("Update stopped: this device is not saving scores right now (storage may be full, or private browsing may be on).\n\nUse Menu, then Back up scores, before updating.");
    return;
  }
  // Updating clears the saved app files and downloads new ones. With no connection that would
  // leave nothing to open, so check first.
  if ((await checkForUpdate()) === "offline") { alert("You're offline, so the update can't download. Nothing was changed. Try again when you're connected."); return; }
  // Download every app file first. Only when all of them arrived, and the page really is this app,
  // replace the saved copy. If anything fails, the current version stays and still works offline.
  if (window.caches) {
    const files = ["./", "index.html", "manifest.webmanifest", "icon-180.png", "icon-192.png", "icon-512.png"];
    let got;
    try {
      const t = Date.now();
      got = await Promise.all(files.map(async f => {
        const res = await fetch(f + "?fresh=" + t, {cache: "no-store"});   // ?fresh= goes past the saved copy
        if (!res.ok) throw new Error(f + " " + res.status);
        if (f === "./" || f === "index.html") { const txt = await res.clone().text(); const m = txt.match(/const APP_VERSION = (\d+);/); if (!m || Number(m[1]) < Number(v.version)) throw new Error("not the new version"); }
        return [f, res];
      }));
    } catch(e){ alert("The update didn't finish downloading, so nothing was changed. Try again when the connection is better."); return; }
    try { localStorage.setItem("phase10.beforeUpdate", JSON.stringify({at: new Date().toISOString(), from: APP_VERSION, state})); }
    catch(e){ try { localStorage.removeItem("phase10.beforeUpdate"); } catch(e2){} }   // never leave an older copy that looks like this one
    try {
      const app = await caches.open("phase10-app");
      for (const [f, res] of got) await app.put(f, res);
      const ks = await caches.keys();
      await Promise.all(ks.filter(k => k.startsWith("phase10-") && k !== "phase10-app").map(k => caches.delete(k)));
    } catch(e){}
  }
  location.reload();
}
async function autoCheck(){
  if (!navigator.onLine) return;
  const r = await checkForUpdate();
  if (r && typeof r === "object") showUpdateBar(r); else $("#upd").innerHTML = "";
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) autoCheck(); });

/* ---------- the device's text size ---------- */
// Sizes are in rem, so a browser's own text size setting carries through. On iPhone and iPad, Safari
// leaves page text alone when Larger Text is set, but the system "body" font follows it (17px at the
// standard size), so the page's base size is scaled to match. Checked again each time the app comes back.
function applyTextSize(){
  if (!(window.CSS && CSS.supports("-webkit-touch-callout", "none") && CSS.supports("font", "-apple-system-body"))) return;
  const probe = document.createElement("span");
  probe.style.cssText = "font:-apple-system-body;position:absolute;visibility:hidden";
  probe.textContent = "x";
  document.body.appendChild(probe);
  const px = parseFloat(getComputedStyle(probe).fontSize);
  probe.remove();
  if (px > 0) document.documentElement.style.fontSize = Math.round(Math.min(Math.max(px / 17, 0.85), 2) * 100) + "%";
}
applyTextSize();
document.addEventListener("visibilitychange", () => { if (!document.hidden) applyTextSize(); });
// Double-tap zoom is turned off by touch-action in the styles (keeps fast repeat taps working).

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
autoCheck();
</script>
